# ====================================================================
# DATABASE & CLOUD DEPLOYMENT CONFIGURATION (Spring Boot + H2)
# ====================================================================

# Uses cloud PORT automatically when deployed, or 8080 on your laptop!
server.port=${PORT:8080}
server.address=0.0.0.0

# Built-in H2 Relational Database (Zero setup needed)
spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created automatically by ParkingRepository.java
spring.sql.init.mode=never

# Web Database Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
